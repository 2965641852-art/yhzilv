name: 构建

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }

      - id: cache-keystore
        uses: actions/cache@v4
        with: { path: android/app/yeheng.keystore, key: yeheng-keystore-v1 }

      - if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore android/app/yeheng.keystore -alias yeheng \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yeheng123 -keypass yeheng123 \
            -dname "CN=Yeheng, OU=D, O=YH, L=BJ, ST=BJ, C=CN"

      - run: |
          echo '{"project_type":"app"}' > .metadata
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: android-app, path: build/app/outputs/flutter-apk/app-release.apk }

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }

      - name: 补全 iOS 项目文件
        run: flutter create --platforms ios --project-name yeheng_discipline --org com.yeheng .

      - run: echo '{"project_type":"app"}' > .metadata
      - run: flutter pub get
      - run: flutter build ios --no-codesign --release

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios-app, path: app.ipa }
