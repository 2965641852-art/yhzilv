name: 构建 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 补全缺失资源
        run: |
          # 创建 .metadata 让 flutter 识别项目
          echo '{"project_type":"app"}' > .metadata

          # 确保 mipmap 目录存在
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
          done

          # 生成占位 Launcher Icon (1x1 透明 PNG)
          ICON_BASE64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPj/HwADBwIAMCbHYQAAAABJRU5ErkJggg=="
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            echo "$ICON_BASE64" | base64 -d > "android/app/src/main/res/$dir/ic_launcher.png"
          done

          # 创建 ic_launcher_background
          cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="ic_launcher_background">#4A90D9</color>
          </resources>
          XMLEOF

      - name: 安装依赖
        run: flutter pub get

      - name: 验证项目
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
