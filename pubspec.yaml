name: yeheng_discipline
description: 叶恒的自律生活 - 待办与时间管理 App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.1

  # 本地数据库
  sqflite: ^2.3.0
  path: ^1.9.0

  # 本地通知
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # 图表
  fl_chart: ^0.68.0

  # 日期处理
  intl: ^0.19.0

  # 日历
  table_calendar: ^3.1.2

  # 桌面小组件
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets: []
